<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biểu Mẫu Đăng Ký Tour Du Lịch | Flynow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
      color: #333;
    }
    h2 {
      color: #0d6efd;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
    }
    .section {
      background: rgb(229, 243, 252);
      border-radius: 12px;
      padding: 25px 30px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-label {
      font-weight: 600;
    }
    .icon-title {
      color: #0d6efd;
      margin-right: 8px;
    }
    textarea {
      resize: none;
    }
    .error-text {
      color: red;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h2><i class="bi bi-file-text"></i> BIỂU MẪU ĐĂNG KÝ TOUR DU LỊCH</h2>
    <form id="tourForm">
      <div class="section">
        <h5><i class="bi bi-person-circle icon-title"></i> THÔNG TIN KHÁCH HÀNG</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Họ và tên</label>
            <input type="text" class="form-control" placeholder="Nhập họ và tên">
          </div>
          <div class="col-md-3">
            <label class="form-label">Ngày sinh</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Giới tính</label>
            <select class="form-select">
              <option>Nam</option>
              <option>Nữ</option>
              <option>Khác</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Số CMND/CCCD</label>
            <input type="text" class="form-control" placeholder="Ví dụ: 079xxxxxxx">
          </div>
          <div class="col-md-6">
            <label class="form-label">Quốc tịch</label>
            <input type="text" class="form-control" placeholder="Việt Nam">
          </div>
        </div>
      </div>

      <div class="section">
        <h5><i class="bi bi-telephone icon-title"></i> THÔNG TIN LIÊN HỆ</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" class="form-control" placeholder="Ví dụ: 090xxxxxxx">
          </div>
          <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="emailInput" placeholder="email@flynow.vn">
            <div id="emailError" class="error-text"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Địa chỉ liên hệ</label>
            <input type="text" class="form-control" placeholder="Số nhà, đường, quận/huyện">
          </div>
        </div>
      </div>

      <div class="section">
        <h5><i class="bi bi-geo-alt icon-title"></i> THÔNG TIN TOUR</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Tên Tour</label>
            <input type="text" class="form-control" placeholder="Ví dụ: Hành trình Đà Lạt 3N2Đ">
          </div>
          <div class="col-md-3">
            <label class="form-label">Mã Tour</label>
            <input type="text" class="form-control" placeholder="FN123456">
          </div>
          <div class="col-md-3">
            <label class="form-label">Ngày khởi hành</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Số ngày</label>
            <input type="number" class="form-control" min="1" placeholder="3">
          </div>
          <div class="col-md-3">
            <label class="form-label">Phương tiện</label>
            <input type="text" class="form-control" placeholder="Xe, Máy bay, Tàu...">
          </div>
          <div class="col-md-6">
            <label class="form-label">Nơi khởi hành</label>
            <input type="text" class="form-control" placeholder="TP.HCM, Hà Nội...">
          </div>
        </div>
      </div>

      <div class="section">
        <h5><i class="bi bi-chat-left-text icon-title"></i> YÊU CẦU ĐẶC BIỆT (nếu có)</h5>
        <textarea class="form-control" rows="4" placeholder="Nhập yêu cầu, ví dụ: ăn chay, phòng đơn, hỗ trợ người già..."></textarea>
      </div>

      <div class="section">
        <h5><i class="bi bi-credit-card icon-title"></i> HÌNH THỨC THANH TOÁN</h5>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" id="cash">
          <label class="form-check-label" for="cash">💵 Tiền mặt</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" id="bank">
          <label class="form-check-label" for="bank">🏦 Chuyển khoản</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" id="card">
          <label class="form-check-label" for="card">💳 Thẻ tín dụng</label>
        </div>
        <hr>
        <h6>Thông tin chuyển khoản:</h6>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Chủ tài khoản</label>
            <input type="text" class="form-control" placeholder="CÔNG TY TNHH FLYNOW">
          </div>
          <div class="col-md-4">
            <label class="form-label">Số tài khoản</label>
            <input type="text" class="form-control" placeholder="0123456789">
          </div>
          <div class="col-md-4">
            <label class="form-label">Ngân hàng</label>
            <input type="text" class="form-control" placeholder="Vietcombank - CN TP.HCM">
          </div>
        </div>
      </div>

      <div class="section">
        <h5><i class="bi bi-pencil-square icon-title"></i> CAM KẾT & XÁC NHẬN</h5>
        <p>Tôi cam kết các thông tin trên là đúng sự thật và đồng ý với điều khoản & chính sách của Flynow.</p>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Ngày đăng ký</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-md-9">
            <label class="form-label">Người đăng ký (Ký và ghi rõ họ tên)</label>
            <input type="text" class="form-control" placeholder="Họ và tên người đăng ký">
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-send"></i> Gửi đăng ký
        </button>
        <button type="reset" class="btn btn-outline-secondary px-4 ms-2">
          <i class="bi bi-arrow-counterclockwise"></i> Làm lại
        </button>
      </div>
    </form>
  </div>

  <script src="Biểu mẫu đăng ký tour du lịch.js"></script>

  <script src="validate.js"></script>
</body>
</html>
