    function getAirportCode(str) 
    {
      const match = str.match(/\(([^)]+)\)/);
      return match ? match[1] : str; 
    }

    const flightsContainer = document.getElementById('flights');
    const continueBtn = document.getElementById('continueBtn');

    function formatPrice(p) 
    {
      return p.toLocaleString("vi-VN") + "đ";
    }

    const search = JSON.parse(localStorage.getItem("flightSearch"));
    let flightsToShow = flights;
    
    if (search) 
    {
      const fromCode = getAirportCode(search.from);
      const toCode = getAirportCode(search.to);
      
      flightsToShow = flights.filter(f => f.from === fromCode && f.to === toCode);
    }

    if (search) 
    {
      function formatDateVN(dateStr) 
      {
        if (!dateStr) return "—";
        const [y, m, d] = dateStr.split("-");
        return `${d}/${m}/${y}`;
      }

    const totalGuests = search.adults + search.children + search.infants;
    const summaryDiv = document.getElementById("summary");
    summaryDiv.innerHTML = `
    <p><strong>Tuyến:</strong> ${search.from} ➜ ${search.to}</p>
    <p><strong>Ngày đi:</strong> ${formatDateVN(search.ngaydi)} ${
      search.tripType === "round"
        ? `| <strong>Ngày về:</strong> ${formatDateVN(search.ngayve)}`
        : ""
    }</p>
    <p><strong>Số khách:</strong> ${totalGuests} người</p>`;
    }

    function renderFlights(list) 
    {
      flightsContainer.innerHTML = "";
      if (list.length === 0) 
      {
        flightsContainer.innerHTML = `<p class="empty">Không tìm thấy chuyến bay phù hợp.</p>`;
        return;
      }

      list.forEach(f => {
        const card = document.createElement('label');
        card.className = "flight-card";
        card.innerHTML = `
          <input type="radio" class="radio" name="flight" value="${f.id}">
          <div class="flight-info">
            <h4>${f.airline}</h4>
            <p>Giờ bay: ${f.depart} - ${f.arrive}</p>
          </div>
          <div class="price">${formatPrice(f.price)}</div>
        `;
        flightsContainer.appendChild(card);
      });
    }
    
    document.addEventListener("change", (e) => 
    {
      if (e.target.name === "flight") {
        continueBtn.disabled = false;
      }
    });


    document.getElementById("filterBtn").addEventListener("click", () => 
    {
      const airline = document.getElementById("airlineFilter").value;
      const price = document.getElementById("priceFilter").value;
      const time = document.getElementById("timeFilter").value;

      let filtered = flights;

      if (airline) filtered = filtered.filter(f => f.airline === airline);
      if (price === "low") filtered = filtered.filter(f => f.price < 2000000);
      else if (price === "mid") filtered = filtered.filter(f => f.price >= 2000000 && f.price <= 3500000);
      else if (price === "high") filtered = filtered.filter(f => f.price > 3500000);

      if (time === "morning") filtered = filtered.filter(f => parseInt(f.depart.split(":")[0]) < 12);
      else if (time === "afternoon") filtered = filtered.filter(f => parseInt(f.depart.split(":")[0]) >= 12 && parseInt(f.depart.split(":")[0]) < 18);
      else if (time === "evening") filtered = filtered.filter(f => parseInt(f.depart.split(":")[0]) >= 18);

      renderFlights(filtered);
    });


    continueBtn.addEventListener("click", () => 
    {
      const selected = document.querySelector('input[name="flight"]:checked');
      if (selected) {
        const flightId = selected.value;
        const chosenFlight = flights.find(f => f.id == flightId);
        localStorage.setItem("selectedFlight", JSON.stringify(chosenFlight));
        window.location.href = "thanh-toan-ve.html";
      }
    });

    renderFlights(flightsToShow);

  </script>
